name: NW-E405 復旧レポート
description: MEMORY ERROR / No Media / ファームウェア更新失敗の診断結果を報告します
title: "[NW-E405] "
body:
  - type: markdown
    attributes:
      value: |
        ## NW-E405 Recovery Report

        ご協力ありがとうございます。

        このプロジェクトは現在開発中です。現在公開している診断版は読み取り専用で、フォーマットやファームウェア書き込みは行いません。

        **報告前に、故障したWalkmanへWindowsのフォーマット、ディスクの初期化、diskpart clean、chkdsk /f等を実行しないでください。**

  - type: input
    id: name
    attributes:
      label: お名前 / ハンドルネーム
      description: 本名でなくて大丈夫です。普段使っている名前を入力してください。
      placeholder: 例：○○
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Walkmanの機種
      value: NW-E405
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 使用しているWindows
      placeholder: 例：Windows 7 64-bit
    validations:
      required: true

  - type: textarea
    id: before
    attributes:
      label: 故障する直前の状況
      description: ファームウェア更新時の状況や、内蔵メモリの空き容量について分かる範囲で教えてください。
      placeholder: |
        例：
        内蔵メモリの空き容量が少ない状態でファームウェア更新を実行しました。
        更新途中で失敗しました。
    validations:
      required: true

  - type: checkboxes
    id: symptoms
    attributes:
      label: 現在の症状
      description: 当てはまるものを選んでください。
      options:
        - label: 本体に「MEMORY ERROR」と表示される
        - label: Windowsではリムーバブルディスクとして認識される
        - label: 開くと「ディスクを挿入してください」と表示される
        - label: DiskPartでは No Media / 0 B と表示される
        - label: サービスモードに入れない
        - label: Sony純正ファームウェアアップデータでは復旧できない

  - type: textarea
    id: extra
    attributes:
      label: その他の情報
      description: エラー表示や気付いたことがあれば書いてください。
      placeholder: 分かる範囲で大丈夫です。

  - type: textarea
    id: log
    attributes:
      label: 診断ログ
      description: NW-E405-Recovery-Tool.exeで作成された NW-E405_diag_YYYYMMDD_HHMMSS.txt を、この欄へドラッグ＆ドロップしてください。内容を直接貼り付けても構いません。
      placeholder: ここへ診断TXTファイルをドラッグ＆ドロップしてください。
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認
      options:
        - label: 故障後、Walkmanをフォーマット・初期化・diskpart clean等していません
          required: true
        - label: このツールが現在開発中の実験的なものだと理解しています
          required: true
